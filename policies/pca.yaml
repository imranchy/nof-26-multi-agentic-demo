id: PCA
name: Priority-based Class Allocation
type: memoryless
objective: SLA-aware fixed-priority allocation
operator_role: Fixed service-priority baseline.
selection_role: Used directly for the sla_priority objective and for explicit PCA counterfactuals.
parameters:
  priority: [enterprise, ran, pon]
requires_previous_state: false
outputs:
  - sc_assignment
  - overall_blocking_ratio_epoch
  - per_class_blocking_ratio
  - fresh_service_ratio
  - reconfig_count
