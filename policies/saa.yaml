id: SAA
name: Stability-Aware Allocation
type: stateful
objective: balance blocking and SC reassignment stability
paper_role: proposed policy
parameters:
  weights_from: config/sla.yaml
  beta_fraction_of_sc_capacity: 0.15
requires_previous_state: true
outputs:
  - sc_assignment
  - overall_blocking_ratio_epoch
  - per_class_blocking_ratio
  - fresh_service_ratio
  - reconfig_count
  - weighted_reconfig_cost
