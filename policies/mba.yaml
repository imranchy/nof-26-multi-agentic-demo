id: MBA
name: Minimum-Blocking Allocation
type: memoryless
objective: weighted residual-demand allocation
operator_role: Blocking-oriented allocation reference.
selection_role: Preferred by the min_blocking objective when blocking and reconfiguration metrics tie.
parameters:
  weights_from: config/sla.yaml
requires_previous_state: false
outputs:
  - sc_assignment
  - overall_blocking_ratio_epoch
  - per_class_blocking_ratio
  - fresh_service_ratio
  - reconfig_count
